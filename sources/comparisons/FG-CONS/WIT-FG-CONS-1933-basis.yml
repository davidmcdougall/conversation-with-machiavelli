# Basis of the Palmarocchi 1933 readings this edition reports
# SPDX-License-Identifier: CC0-1.0
#
# Review pass 2 (2026-11-25). Where the edition reports or follows a reading of
# WIT-FG-CONS-1933-PALMAROCCHI, this file records what Palmarocchi's own edition
# says about where that reading comes from: the single autograph, or his own
# supply. Facts about the 1933 book, read from its Nota (pp. 339-342) on the
# Wikisource transcription of the BEIC scan, 2026-11-25. Nothing of the Nota's
# wording is reproduced beyond the readings themselves.

witness: WIT-FG-CONS-1933-PALMAROCCHI
read_from: "Scritti politici e ricordi (1933), Nota, A) I-III, pp. 339-342; https://it.wikisource.org/wiki/Scritti_politici_e_ricordi/Nota"

general:
  manuscript: "One manuscript exists, the autograph, in the Archivio Guicciardini, Carte di Francesco Guicciardini, Filza IX (Nota p. 339, p. 341). The 1933 text is edited from it."
  body_readings: "autograph. Palmarocchi presents his body text as the autograph's; the Nota gives no list of conjectures, and none of the readings this edition reports is bracketed in his text. Where no entry below names a locus, that is the whole of what his edition says about it."
  headings: "editorial. The bracketed Discorsi chapter titles over each reply are Palmarocchi's, supplied (as Canestrini had done) from the Mazzoni-Casella edition of the Discorsi; they are not in the autograph (Nota p. 340). Records of class `heading` report these."
  author_variants: "Nota A.III (pp. 341-342) lists Guicciardini's own cancelled first readings in the autograph. This edition does not report them."
  dating: "Palmarocchi dates the work between the end of 1529 and the first months of 1530, from the reference to the prince of Orange (Nota p. 339; our FG-CONS.1.10). Consistent with the edition's dating (DEC-013, Cutinelli-Rendina 2014); not used as a second dating."
  completeness: "Palmarocchi reports that the autograph lays out further chapters Guicciardini meant to answer, numbered, each followed by blank pages: Book I 17, 18, 35, 36; Book II 2, 4, 16, 17, 18, 21, 32; Book III 6, 13, 21, 22, 27, 34, 36, 37, 38 (Nota pp. 339-340). Not yet reflected in the edition; raised with David in review pass 2."

