    rationale: "Canestrini's heading without `del libro II`, as printed (D443). His rubric, its broken `e` read with Machiavelli's 1824 rubric; `fieno`, read by both readers without doubt, where the 1933 edition prints `fiano` and `diliberazioni`; no stop (D471, as D463). Canestrini's footnote to the reply, his summary of the chapter, not carried (D463)."
