source_unit_id: FG-CONS.1.3
governing_witness: WIT-FG-CONS-1857-CANESTRINI
comparison_witness: WIT-FG-CONS-1933-PALMAROCCHI
records:
- id: FG-CONS-I3-D001
  locator: FG-CONS.1.3.01
  class: emendation
  witness_1857: E posto troppo assolutamente
  witness_1933: È posto troppo assolutamente
  established: "[È] posto"
  publish_as_variant_note: true
  rationale: 'Canestrini prints `E`, the conjunction, and the opening period then has no finite verb.
    The 1933 edition''s `È posto`, "it is laid down", gives Guicciardini''s opening judgment, and the
    text is emended from it.'
- id: FG-CONS-I3-D002
  locator: FG-CONS.1.3.02
  class: punctuation
  witness_1857: "di loro — Le quali"
  witness_1933: "di loro. Le quali"
  established: "di loro. — Le quali"
  publish_as_variant_note: false
  rationale: Canestrini marks the turn with a dash; the stop before it is supplied from the 1933 edition (C002).
- id: FG-CONS-I3-D004
  locator: FG-CONS.1.3.01
  class: ruled_reading
  witness_1857: etiam avendo fac[u/o]ltà di fare male (a damaged letter)
  witness_1933: etiam avendo facultà di fare male
  established: etiam avendo facultà di fare male
  publish_as_variant_note: true
  rationale: Both cold readers doubted the vowel. The scan breaks u into n-shapes throughout; the same reply prints `facultà del fare male` clearly a few lines later, and the 1933 edition agrees. The English ("capacity") is the same either way (D112).
- id: FG-CONS-I3-D005
  locator: FG-CONS.1.3.02
  class: ruled_reading
  witness_1857: dello eleggere [a/e'] tribuni (a damaged letter)
  witness_1933: dello eleggere e' tribuni
  established: dello eleggere e' tribuni
  publish_as_variant_note: true
  rationale: 'The printed letter is a-shaped, but the scan prints barless e as a throughout this paragraph (`ara` for `era` twice); the reply prints `e tribuni` two sentences later, and `eleggere` takes a direct object, so `a` will not construe. Read `e''`, the plural article, with the 1933 edition: a reading, not an emendation (D113).'
- id: FG-CONS-I3-D003
  locator: FG-CONS.1.3.01-02
  class: systematic_orthographic_profile
  witness_1857: "Canestrini's `il`, `populo`, `periculo`, `remedio`, `premii`, `comodi`, `potenza`, `licenza`, `mostro`, `adunque`"
  witness_1933: "Palmarocchi's `el`, `popolo`, `pericolo`, `rimedio`, `premi`, `commodi`, `potenzia`, `licenzia`, `monstro`, `adunche`, heavier pointing"
  established: witness_1857
  rationale: Canestrini governs throughout. No other difference of word or sense.
