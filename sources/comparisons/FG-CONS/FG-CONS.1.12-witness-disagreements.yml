comparison_witness: WIT-FG-CONS-1933-PALMAROCCHI
records:
  - id: FG-CONS-I12-D001
    locator: FG-CONS.1.12.03
    class: supplied_letters
    witness_1857: "non ebbe patito"
    witness_1933: "non [ar]ebbe patito"
    established: witness_1857
    established_on: 2026-09-21
    established_by: "David McDougall, D38"
    publish_as_variant_note: true
    rationale: >
      CORRECTED 2026-09-21 (FG-CONS-I12-F001). The previous record stated
      witness_1857 as "non [ar]ebbe patito" and explained the brackets as
      Canestrini's supplied letters. Both are false: the brackets are printed
      on the PALMAROCCHI page (p. 23) and Canestrini (p. 28) prints plain
      "ebbe". The established text carries the Palmarocchi reading. Sense
      differs - "did not suffer" against the counterfactual "would not have
      suffered" - so this is not orthographic.

      RESOLVED 2026-09-21 (D38). Canestrini governs even where his reading is
      the weaker one; Palmarocchi's counterfactual is published as a variant
      note, not adopted. Takes effect when the unit is re-established - the
      current corpus text carries the Palmarocchi reading and is not patched
      in isolation. Revisit on a cleaner Canestrini impression or a third
      public-domain witness.
