source_unit_id: FG-CONS.1.12
governing_witness: WIT-FG-CONS-1857-CANESTRINI
comparison_witness: WIT-FG-CONS-1933-PALMAROCCHI
records:
  - id: FG-CONS-I12-D001
    locator: FG-CONS.1.12.03
    class: supplied_letters
    witness_1857: "non ebbe patito"
    witness_1933: "non [ar]ebbe patito"
    established: witness_1857
    established_on: 2026-09-21
    established_by: "David McDougall, D38"
    publish_as_variant_note: true
    rationale: >
      Canestrini prints the plain indicative, "did not suffer"; Palmarocchi
      prints the counterfactual, "would not have suffered", which is the
      reading the argument seems to want. This edition follows its governing
      witness even where the comparison witness reads better, and records the
      alternative here.
    history: >
      Until 2026-09-21 the established text carried Palmarocchi's reading
      under Canestrini's name (FG-CONS-I12-F001; decisions.md D38, D44).
  - id: FG-CONS-I12-D004
    locator: FG-CONS.1.12.03
    class: reading
    witness_1857: "ché io reputo che"
    witness_1933: "che io reputo che"
    established: witness_1857
    established_on: 2026-09-25
    publish_as_variant_note: true
    rationale: >
      Canestrini accents the first "che", making it causal: "for I reckon
      that". Without the accent it can be read as consecutive, "so that".
  - id: FG-CONS-I12-D002
    locator: FG-CONS.1.12.03
    class: orthographic
    witness_1857: "in varii tempi"
    witness_1933: "in vari tempi"
    established: witness_1857
    rationale: "Canestrini spelling retained."
  - id: FG-CONS-I12-D003
    locator: FG-CONS.1.12.01-FG-CONS.1.12.03
    class: systematic_editorial_profile
    witness_1857: "Canestrini capitalization, punctuation, word division, and supplied-letter notation"
    witness_1933: "Palmarocchi capitalization, punctuation, and spelling profile"
    established: witness_1857
    rationale: "No hybridization; Canestrini governs throughout and Palmarocchi remains independent collation evidence only."
