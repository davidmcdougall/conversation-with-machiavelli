  quoted: "p. 96, ll. 1-10: `la sera mi ritorno a casa, ed entro nel mio Scrittojo; ed in sull'uscio mi spoglio quella veste contadina, piena di fango e di loto, e mi metto panni reali e curiali, e rivestito condecentemente entro nelle antiche corti degli antichi uomini, dove da loro ricevuto amorevolmente mi pasco di quel cibo, che solum è mio, e che io nacqui per lui; dove io non mi vergogno parlare con loro, e domandare della ragione delle loro azioni; e quelli per loro umanità mi rispondono` (Class A applied: spaces before punctuation, elision closed)"
  date: "p. 98: `Die 10 Decembris 1513.`; read by both passes"
  ruling: D339
note: "A normalised 1813 text, not the autograph. The spellings SCOPE §1 quoted from memory (`le antique corti delli antiqui huomini`, `humanità`) are not this witness's and are withdrawn (D339)."
