normalisation_notes: "Class A only: accents (`Perchè` → `Perché`, `perchè` → `perché`, `benchè` → `benché`, `nè`/`Nè` → `né`/`Né`, `sè` → `sé`, `intantochè` → `intantoché`); elision closed up (`all' arme`, `ch' egli`, `l' animo`, `l' amicizia`, `l' attraversano`, `d' ajuto`); the space restored after the apocopated `da'`, `ne'`, `de'` (`da'Romani`, `ne'Popoli`); spaces before punctuation removed; line-end hyphens removed; the italic Latin kept in italic, `accomodare` as printed. `principj`, `dubbj`, `Lavinj`, `noje`, `volontarj`, `ajuta`, `ajuto`, `ajutare` as printed."
