collation_result: >
  318 words each (p. 78 202, p. 79 116). Both readers gave the word as the
  preferred reading at the scan's broken letters, and the token streams are
  identical in every word and mark (D510). The common doubt `Pompeo ⟨e|o⟩
  Crasso`, both preferring `e`, read with the 1933 (D486). `o provincie`,
  `di Gallia` and the want of `che` kept against the 1933 (D38, D510);
  `decemvirale` against the 1933 `decennale` kept provisionally (O50).
  Pointing by D110; Canestrini's printed stop at the end kept (D460).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `imperii`, `nazioni o provincie`, `e a'`, `il lungo`, `di Gallia`, `il fondamento`, `divisioni`, `tirannidi`, `populi`, `conjurazione`, `decemvirale`, `e avendo`, `le prorogazioni` without `che`, `usorono`, `e i semi`, against the 1933 `imperi`, `nazione e provincie`, `ed a'`, `el lungo`, `in Gallia`, `el fondamento`, `divisione`, `tirannide`, `popoli`, `coniurazione`, `decennale`, `ed avendo`, `che le prorogazione`, `usarono`, `ed e' semi`. The passes read Canestrini."
boundaries: "printed pp. 78-79; heading CONSIDERAZIONE SUL CAPITOLO XXIV at the head of p. 78, without `del libro III`, a faint trace after XXIV that both readers doubt; a one-line rubric in smaller roman type with a printed stop; one paragraph, indented at p. 78 l. 1; ends p. 79 l. 12 `nè facultà di travagliarla per altra via.`; a short rule, and on the next page the half-title RICORDI POLITICI E CIVILI: the last reply. Canestrini's note on p. 78 is keyed to this reply"
heading: "CONSIDERAZIONE SUL CAPITOLO XXIV, without `del libro III` (both readers); the faint trace after XXIV, doubted by both, not read as a stop, the 1933 printing none (D110); set in the unit's `heading` front-matter (D443, D511)"
rubric: "La prolungazione degl' imperii fece serva Roma. (both readers doubting `imperii` and `fece` at broken letters): read with the 1824 rubric but for Canestrini's `degl'imperii`; the printed stop, seen by both, carried (D511)"
