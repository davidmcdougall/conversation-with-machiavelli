normalisation_notes: "Class A: accents (`nè` → `né`, `perchè` → `perché` ×3, `benchè` → `benché`); elision solid (`l'onore`, `dall'altro`); apocope spaced (`co' buoni`, `de' principi`, `de' remedii`, `co' beneficii` ×2, the faint apostrophe of the second supplied by D39); the Florentine plural article supplied as `e'` (D35: `e' quali` ×2, `e' regni`, `e' rimedii`, `e' remedii`); line-end hyphens removed; spaces before punctuation removed. Canestrini's note reference after `sì forti` and his footnote are his, not Guicciardini's, and are not carried."
