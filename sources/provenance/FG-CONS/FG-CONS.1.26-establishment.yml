collation_result: >
  313 words (A and B). One word-level split, `dallo`/`dello interesse`, read
  `dello` (D279). Three doubts common to both readers whose alternatives are
  words, read as both prefer: `interesse`, `sono`, `petto` (D280). One split
  of pointing and two common doubts of pointing settled by D110. No clause or
  sense disagreement.
witness_independence_check: "SCOPE §7. At the one word split pass A keeps the printed shape, pass B the 1933 form; the 1933 form is what both readers give as alternative. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `il principato`, `il trattarli`, `il principe`, `mutazioni`, `armi proprie`, `guadagnarla`, `necessarii remedii`, `estraordinarii`, `comunemente`, an unbracketed `non ricognoscere`, against the 1933 `el principato`, `el trattarli`, `el principe`, `mutazione`, `arme proprie`, `guadagnarli`, `necessari remedi`, `estraordinari`, `communemente`, `[non] ricognoscere`. The passes read Canestrini."
boundaries: "printed pp. 40-42; heading CONSIDERAZIONE SUL CAPITOLO XXVI on p. 40 after the last line of the reply on XXV (`di maggiore potestà.`); Canestrini's two-line rubric `Un principe nuovo, in una città o provincia presa da lui, debbe fare ogni cosa nuova`, its stop faint; one indented paragraph (`Sono alcune città`); ends p. 42 line 3 `estraordinarii e violenti`, its stop doubtful; CONSIDERAZIONE SUL CAPITOLO XXVIII follows (Guicciardini has no reply on XXVII). One footnote of Canestrini's, keyed after `sì forti` on p. 41."
