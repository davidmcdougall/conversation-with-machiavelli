collation_result: >
  About 1,270 words (A 1,264, B 1,288; they count elisions differently).
  Two word-level splits, `molta`/`molte` and `a`/`a'` before `consuli`, ruled
  `molte` and `a'` with the 1933 edition (D215). No clause or sense
  disagreement. One confident shared reading against the comparison witness
  at letters the scan breaks, `riputazione e tenere` (1933 `terrore`),
  emended under D68 (D214); one, `da' Commentarii` (1933 `de'`), kept (D216).
  Common doubts where the alternative is a word, read with the 1933 edition
  (D215). Six stops supplied (D67); three marks of uncertain weight follow
  the 1933 edition (D110).
witness_independence_check: "SCOPE §7. At the two split loci pass A sides with Palmarocchi at neither (`molta`, `a`), pass B at both (`molte`, `a'`), each from a damaged letter or mark the reader doubted. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `tenere`, `da'`, `averno`, `contro la libertà`, `e i potenti`, `quelli della parte`, `ha fatto`, against the 1933 `terrore`, `de'`, `averne`, `contro alla libertà`, `e potenti`, `quella parte`, `hanno fatto`."
boundaries: "printed pp. 31-35; heading CONSIDERAZIONE SUL CAPITOLO XVI. at the head of p. 31; Canestrini's rubric `Un popolo uso a vivere sotto un principe, se per qualche accidente diventa libero, con difficultà mantiene la libertà`, unstopped; five indented paragraphs (p. 31 l. 1, p. 32 l. 1, p. 32 last line, p. 33 l. 25, p. 34 l. 23); ends p. 35 l. 22 `causa di desiderare la libertà.`; CONSIDERAZIONE SUL CAPITOLO XXIII follows"
