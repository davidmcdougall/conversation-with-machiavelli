witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `truovano`, `ragioni`, `considerazioni`, `e` (not `ed`) `a volerlo`, `tenti`, `potenza`, `tutto`, `il` (not `el`), `condizioni`, `azioni`, `pari`, `degli inimici`, `ribellioni`, `dopo`, `forse più` (no `molto`), against the 1933 `trovano`, `ragione`, `considerazione`, `ed a`, `temi`, `potenzia`, `tutte`, `el`, `condizione`, `azione`, `pare`, `delli`, `ribellione`, `doppo`, `forse molto più`. At the one split, pass B preferred the 1933 letter and gave the printed one as its observation: a preference for sense, not a reading of the other book. The passes read Canestrini."
