collation_result: >
  365 words (A 365, B 365), the 408 body tokens identical after preferred
  readings but for the accent on `vòlti` (Class A). No word, clause or sense
  disagreement in the body. Two rubric splits between words, `è` and
  `intra`, read with the 1933 edition (D355). Two common doubts whose
  alternatives are words, `e che` and `sì`, read with the 1933 edition
  (D356). Marks doubtful to both settled by D110 and D67 (D357).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `il principale`, `e i compagni`, `il persuadersi`, `leggi`, `populo`, `nobiltà`, `trovano`, `ragioni`, `cagioni leggieri`, `imprudenza`, `occorrenze`, against the 1933 `el principale`, `ed e' compagni`, `el persuadersi`, `legge`, `popolo`, `nobilità`, `truovano`, `ragione`, `cagione leggiere`, `imprudenzia`, `occorrenzie`. The passes read Canestrini."
boundaries: "printed pp. 51-52; heading CONSIDERAZIONE SUL CAPITOLO XL at the head of p. 51 under the running head (no replies on XXXIII-XXXVIII; the reply on XXXIX ends on p. 50); Canestrini's three-line rubric in smaller type; two indented paragraphs (`Io mi persuado` ... `occupare la libertà.`, `E quanto alla dottrina generale` ... `occorrenze che girano.`); CONSIDERAZIONE SUL CAPITOLO XLVII follows on p. 52; no note belongs to the reply"
