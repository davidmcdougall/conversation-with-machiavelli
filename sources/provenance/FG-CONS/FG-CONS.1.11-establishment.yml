collation_result: >
  About 340 words. No word, clause or sense disagreement. One confident
  shared reading, `e l'armi o la religione`, emended `[e]` under D68
  (D200). Four letters doubtful to both readers, ruled by David with the
  1933 edition or kept (D201): `e'`, `meriti`, `si`, `animi` (kept against
  the 1933 `uomini`); `Romolo` kept as printed. One mark both readers see
  and neither can weigh follows the 1933 edition (D110).
witness_independence_check: "SCOPE §7. The passes split at no word. Neither carries a Palmarocchi word-reading: both read `o`, `armi`, `Romolo`, `mettere le armi`, `animi`, `prudenza`, against the 1933 `e`, `arme`, `Romulo`, `mettervi le arme`, `uomini`, `prudenzia`."
boundaries: "printed pp. 26-27; heading CONSIDERAZIONE SUL CAPITOLO XI. on p. 26 after `che abbia fatto.`; Canestrini's rubric `Della religione de' Romani`, unstopped; one indented paragraph; ends p. 27 line 21 `con la religione.`; CONSIDERAZIONE SUL CAPITOLO XII follows"
