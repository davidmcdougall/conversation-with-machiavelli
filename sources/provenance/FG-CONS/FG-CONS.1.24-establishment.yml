normalisation_notes: "Class A: accents (`perchè` → `perché`, `nè` → `né` in the rubric; `così` and `sì` (×3), where the accent is faint, set accented as both readers prefer); elision solid (`l'omicidio` twice, `d'averlo` twice, `glien'avessi`, `l'uno`, `l'altro`); apocope spaced (`de' meriti` twice, the second without a visible apostrophe, D39; `da' privati`, `a' privati`, `a' magistrati`, `co' peccati`); the Florentine plural article supplied as `e'` (D35: `e' meriti` twice); line-end hyphens removed; spaces before punctuation removed. `tanto` is doubted by B alone."
