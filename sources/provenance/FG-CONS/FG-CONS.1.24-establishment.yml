collation_result: >
  263 words (A), 258 (B, counting closed elisions as one). Two splits, both
  of preferred reading only: A prefers the printed shapes `poputo` and
  `petere` as possible misprints, B prefers `populo` and `potere` as scan
  damage, each giving the other's form as alternative; ruled readings with
  the 1933 edition (D246). No clause or sense disagreement. One confident
  shared reading that barely construes, `con via provocata` (1933 `con ira
  provocata`), emended `[ir]a` (D245). One confident shared reading against
  the comparison witness at a letter the scan breaks, `era andata` (1933
  `andato`), kept (D247). Two marks of uncertain weight follow the 1933
  edition (D110).
witness_independence_check: "SCOPE §7. At the two split loci pass B sides with Palmarocchi (`populo`/`popolo`, `potere`), pass A against, each on a letter both readers doubted. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `andata`, `pensatamente`, `via provocata`, `il populo`, `cagioni`, against the 1933 `andato`, `pesatamente`, `ira provocata`, `el popolo`, `cagione`. The passes read Canestrini."
boundaries: "printed pp. 39-40; heading CONSIDERAZIONE SUL CAPITOLO XXIV on p. 39 after line 2, the last line of the reply on XXIII (`difficile il farlo.`); Canestrini's two-line rubric `Le repubbliche bene ordinate constituiscono premii e pene ai loro cittadini, nè compensano mai l'uno con l'altro`, unstopped; one indented paragraph (`Si può dire forse`); ends p. 40 l. 3 `nel caso di Orazio.`; CONSIDERAZIONE SUL CAPITOLO XXV follows"
