collation_result: >
  948 words (A), 947 (B). Three word-level splits, none a difference of
  word: `si ha`/`s'ha` ruled `s'ha` with the 1933 edition (D234),
  `risoluto`/`resoluto` (spelling; the printed o-shape is a barless e) and
  `ne'`/`ne` (apostrophe, D39). No clause or sense disagreement. Two
  confident shared readings against the comparison witness at letters the
  scan breaks: `o il guadagno` (1933 `ed el`), kept (D231); `ripreso` (1933
  `riprese`), emended (D232). One confident shared whole-word reading,
  `parato` (1933 `partito`), emended (D233). Common doubts where the
  alternative is a word read with the 1933 edition (D234). Four marks of
  uncertain weight follow the 1933 edition (D110).
witness_independence_check: "SCOPE §7. At the six split loci pass B sides with Palmarocchi at five, pass A at one, each from a damaged letter or mark the reader doubted. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `o il guadagno`, `restorono così combattendo`, `Flaminio Quinto`, `danno suo`, `ripreso`, `possono militare`, `combattuto`, `parato`, `delle sue forze`, against the 1933 `ed el guadagno`, `così potenti combattendo`, `Tito Quinzio`, `danno tuo`, `riprese`, `può militare`, `combattuti`, `partito`, `delle tue forze`."
boundaries: "printed pp. 35-39; heading CONSIDERAZIONE SUL CAPITOLO XXIII on p. 35 after line 22, the last line of the reply on XVI; Canestrini's rubric `Che non si debbe mettere a pericolo tutta la fortuna e non tutte le forze; e per questo, spesso il guardare i passi è dannoso`, unstopped; four indented paragraphs (p. 35 `Io non credo`, p. 36 l. 29, p. 38 l. 7, p. 38 l. 30); ends p. 39 l. 2 `è difficile il farlo.`; CONSIDERAZIONE SUL CAPITOLO XXIV follows"
