normalisation_notes: "Class A: accents (`perchè` → `perché`, `nè` → `né`, `sè` → `sé`; `tôrsi` (B) and `tòrsi` (A) set `tòrsi`, as `tòrre` in FG I.10); elision solid (`d'accordo`, `s'ha`, `l'uno`, `l'altro`, `dall'altro`, `nell'altra`, `s'avessino`, `gl'importa`, `d'onde`, `n'arebbe`); apocope spaced (`su' passi`, `su' monti`, `su' fiumi`, `de' monti`, `de' Romani`, `de' paesani`, `ne' quali`, `ne' luoghi`, `a' tempi`, `a' Romani`, `a' quali`, `a' passi`); the Florentine plural article supplied as `e'` (D35: `e' Romani` twice, `e' partiti`, `e' Franzesi` twice, `e' Svizzeri`, `e' passi`); line-end hyphens removed; spaces before punctuation removed. `circumjacente` keeps Canestrini's j."
