collation_result: >
  363 words (A 363, B 363), the 414 body tokens identical after preferred
  readings but for `pericoloso`/`periculoso` and the point after
  `cognosce`. The word split and the rubric's `ne'`/`nei` read with the
  1933 edition (D366). Four common doubts whose alternatives are words,
  `o`, `quelle`, `delle`, `su`, read with it (D367). `vero` kept against
  the 1933 `vera` (D368). Marks doubtful to both settled by D110 and D67
  (D369).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `il Discorso`, `esperienza` ×2, `sentenza`, `e a questo`, `avvisi`, `populo`, `leggi`, `vero`, `e in questo`, `il giudicio`, `ne hanno`, `le opinioni universali`, `elezioni`, `ignoranza`, against the 1933 `el Discorso`, `esperienzia`, `sentenzia`, `ed a questo`, `avisi`, `popolo`, `legge`, `vera`, `ed in questo`, `el giudicio`, `n'hanno`, `le opinione universale`, `elezione`, `ignoranzia`. The passes read Canestrini."
boundaries: "printed pp. 52-53; heading CONSIDERAZIONE SUL CAPITOLO XLVII on p. 52 below the end of the XL reply (`... e altre occorrenze che girano.`); Canestrini's two-line rubric; two indented paragraphs (`Quello che dice il Discorso` ... `habita esset. »`, p. 52 l. 1 - p. 53 l. 9; `L'altra conclusione del Discorso` ... `il giudicio di pochi.`, p. 53 ll. 10-26); Canestrini's note (1) at the foot of p. 52, keyed to `verità.`, not carried; CONSIDERAZIONE SUL CAPITOLO XLIX opens p. 54"
