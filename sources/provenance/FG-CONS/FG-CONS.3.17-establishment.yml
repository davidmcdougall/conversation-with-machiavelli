collation_result: >
  330 words each (p. 74 183, p. 75 147). Both readers gave a broken
  letter's shape as the preferred reading and the word as the alternative;
  each such doubt read as the word, which alone is Italian and which the
  1933 prints, the token streams then identical (D494). The common doubt
  `le azioni ⟨suo|sue⟩` read `sue` with the 1933 (D494). Pointing by D110;
  the stop after `pensiero` supplied (C001, D67); Canestrini's printed
  stop at the end kept (D460).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `populo`, `il quale` ×2, `Il quale`, `e anche`, `e a sè proprio`, `e andò`, `meraviglia`, `azioni`, `fece il possibile`, `doppo il consulato`, `Il che`, against the 1933 `popolo`, `el quale`, `El quale`, `ed anche`, `ed a sé proprio`, `ed andò`, `maraviglia`, `azione`, `fece el`, `doppo el`, `il che`. The passes read Canestrini."
boundaries: "printed pp. 74-75; heading CONSIDERAZIONE SUL CAPITOLO XVII DEL LIBRO III. on p. 74 below the end of the II.24 reply (`non le smurorono.`), with a printed stop; a two-line rubric in smaller roman type with no stop; one paragraph, indented at p. 74 l. 1; ends p. 75 l. 15 `volerla sollecitare.`; CONSIDERAZIONE SUL CAPITOLO XIX follows on p. 75 (no reply to III.18). Canestrini's note on p. 75 is keyed to this reply"
heading: "CONSIDERAZIONE SUL CAPITOLO XVII DEL LIBRO III., with `del libro III` and a stop (both readers), set in the unit's `heading` front-matter (D443, D495)"
rubric: "Che non si offenda uno, e poi quel medesimo si mandi in amministrazione e governo d' importanza (B without doubt; A doubting `in` and a broken t in `amministrazione`): read with the 1824 rubric; no stop (D495, as D463, D487)"
