collation_result: >
  318 and 319 words (A: p. 66 187, p. 67 130; B: 188, 131; the difference
  is A counting the unspaced `d'in-dustria` as one), the body tokens
  identical after preferred readings but two splits, `⟨eltam|etiam⟩`
  (p. 66 l. 2) and `⟨sna|sua⟩` (p. 66 l. 11), where both readers see the
  printed letters: emended `e[ti]am`, `s[u]a` (D450, as D439). Six non-words
  both readers prefer as printed, emended (D450, as D381, D396).
  `fraudolenta` emended `fraudolent[o]` on the recommendation (O46, open).
  Pointing doubtful to both read with the 1933 edition (D110); one stop
  supplied (D67); no stop at the unit's end (D40).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `il mancamento`, `trovino`, `e imperii`, `arti`, `prudenza` (twice), `ai Latini`, `il trovarsi`, `il fine`, `il quale`, `populo`, `anche`, `fraudolenta`, against the 1933 `el mancamento`, `truovino`, `ed imperi`, `arte`, `prudenzia`, `a' latini`, `el trovarsi`, `el fine`, `el quale`, `popolo`, `adunche`, `fraudulento`. At both splits the reader preferring the word saw and reported the printed letters. The passes read Canestrini."
boundaries: "printed pp. 66-67; heading CONSIDERAZIONE SUL CAPITOLO XIII at the head of p. 66, without `del libro II` (the L of CAPITOLO broken), then a two-line rubric in smaller type; one indented paragraph; ends p. 67 l. 14 `di conseguire gli intenti suoi`, only a faint trace after it; CONSIDERAZIONE SUL CAPITOLO XIV follows on p. 67"
heading: "CONSIDERAZIONE SUL CAPITOLO XIII, without `del libro II`, set in the unit's `heading` front-matter (D443)"
rubric: "Che si ⟨viena|viene⟩ di bassa a gran fortuna ⟨piu|più⟩ con la fraude⟨.|,⟩ / che con la forza⟨.|∅⟩ (A and B alike, each preferring the printed `viena` and the stop after `fraude`): read `viene`, `fraude,` with the 1824 rubric and the 1933 edition; `più` by DEC-009; no stop (D451, as D430, D440)"
