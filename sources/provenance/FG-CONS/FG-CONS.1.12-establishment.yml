history:
  - version: "0.2.1"
    status: withdrawn
    withdrawn_on: 2026-09-21
    reason: >
      FG-CONS-I12-F001. Established from Palmarocchi 1933, the comparison
      witness, and labelled Canestrini. Claimed S2 without witness
      independence, and reproduced Palmarocchi's editorial expression in a
      corpus file licensed for reuse, in breach of DEC-010. The 2026-09-18
      dual pass detected all twenty-nine loci; the collation classified them
      as orthographic convention.
  - version: "0.3.0"
    status: review_pending
    established_on: 2026-09-21
    reason: Re-established from Canestrini on two independent cold passes.

passes:
  - id: B
    performed: 2026-09-18
    file: sources/coldpass/FG-CONS.1.12-passB.md
  - id: C
    performed: 2026-09-21
    file: sources/coldpass/FG-CONS.1.12-passC.md
    note: >
      Run because pass A was withdrawn and SCOPE §7 forbids an image-derived
      reading entering the text on a single pass.

collation: sources/coldpass/COLLATION-2026-09-21.md
collation_result: >
  17 divergences in 421 words. One is a reading (F002, open). Two are
  sentence-final stops displaced by note references (supplied, declared, O12).
  Two are apostrophes absent on the page and supplied by rule (D35, D39).
  Thirteen are whitespace before punctuation or after an elided apostrophe,
  collapsed under DEC-009 Class A. Both passes agree on the identity of every
  punctuation mark, which settles D37.
witness_independence_check: >
  SCOPE §7 2a. Pass C agrees with Palmarocchi at no locus where F001 found pass
  A siding with it. Both surviving passes read the governing witness.

interventions:
  - id: FG-CONS-I12-C002
    operation: editorial_supply
    locator: FG-CONS.1.12.01
    locus: "del mondo"
    before: "del mondo ⁽¹⁾ E anche"
    after: "del mondo. E anche"
    rationale: >
      Canestrini sets the note reference in the slot where the full stop
      belongs. This edition does not carry his note references in the body, so
      removing one without restoring the stop would create an artefact of the
      edition's own making rather than reproduce one of the witness's. Declared,
      not silent. See O12.
    review_status: open
  - id: FG-CONS-I12-C003
    operation: editorial_supply
    locator: FG-CONS.1.12.02
    locus: "cittadini proprii"
    before: "cittadini proprii ⁽¹⁾ E se bene"
    after: "cittadini proprii. E se bene"
    rationale: Same as C002.
    review_status: open
  - id: FG-CONS-I12-C004
    operation: witness_correction
    locator: FG-CONS.1.12.03
    locus: "sotto uno re ␣␣ pure"
    before: "sotto uno re  pure"
    after: "sotto uno re; pure"
    evidence: >
      Both passes independently found a gap of about two word-spaces with no
      ink, pass C measuring it against the word spaces either side. Palmarocchi
      1933 p. 23 prints "sotto uno re; pure". A dropped sort recovered from the
      comparison witness, not a variant adopted - the distinction D38 turns on.
    review_status: accepted
    closes: O09

not_supplied:
  - locus: "inclinazione sua"
    note: >
      No terminal stop. Both passes agree none is printed. DEC-009 Class B
      clause 10, and problematic.md requires the unit to end mid-thought. The
      asymmetry with C002/C003 is principled: those restore a break the note
      reference displaced; this would close a period the author left open.
      Settles O07.

unresolved_source_findings: [FG-CONS-I12-F002]
