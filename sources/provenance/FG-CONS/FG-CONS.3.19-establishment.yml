collation_result: >
  641 words each (p. 75 93, p. 76 251, p. 77 297). Both readers gave a
  broken letter's shape as the preferred reading and the word as the
  alternative; each such doubt read as the word, which alone is Italian and
  which the 1933 prints (D502). `suavissima` read with A, the shape and the
  1933 where the readers named two forms (D406, D502). The token streams
  then identical but at one split, `pericolose` (A) / `periculose` (B),
  both without doubt: `periculose` applied provisionally (O49). `sarebbe`,
  `città` and `genti` kept against the 1933 (D38, D502). Pointing by D110;
  the stop after `ammirabile` supplied (C001, D67); Canestrini's printed
  stop at the end kept (D460).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `il medesimo`, `il timore`, `il signore`, `il quale`, `il principe`, `populi`, `benevolenza`, `e a questo`, `e allora`, `condizioni`, `nazioni`, `gl' Italiani`, `ufficio`, `ordinarii`, `o vero`, `abbondare`, `sarebbe`, `città`, `genti`, against the 1933 `el ...`, `popoli`, `benevolenzia`, `ed a`, `ed allora`, `condizione`, `nazione`, `gli italiani`, `uficio`, `ordinari`, `overo`, `abondare`, `farebbe`, `vita`, `grazie`. Pass A's `pericolose` agrees with the 1933 at the one split, a single form. The passes read Canestrini."
boundaries: "printed pp. 75-77; heading CONSIDERAZIONE SUL CAPITOLO XIX on p. 75 below the end of the III.17 reply (`volerla sollecitare.`), without `del libro III`, a pale dot after XIX that both readers doubt; a two-line rubric in smaller roman type with no stop; two paragraphs, indented at p. 75 l. 1 and p. 77 l. 1 (`L' altra distinzione`); ends p. 77 l. 29 `non può fare che non sia temuto.`; CONSIDERAZIONE SUL CAPITOLO XXIV opens p. 78. Canestrini's note on p. 76 is keyed to this reply"
heading: "CONSIDERAZIONE SUL CAPITOLO XIX, without `del libro III` (both readers); the pale dot after XIX, doubted by both, not read as a stop, the 1933 printing none (D110); set in the unit's `heading` front-matter (D443, D503)"
rubric: "Se a reggere una moltitudine è più necessario lo ossequio che la pena (A doubting `moltitudine`, B `una` and `moltitudine`, at broken letters): read with the 1824 rubric but for Canestrini's `lo ossequio`; no stop (D503, as D463, D487, D495)"
