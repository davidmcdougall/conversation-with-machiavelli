collation_result: >
  841 words. No word, clause or sense disagreement. Three letters doubtful
  to both readers, ruled by David: `resti` (D182), `e almanco` (D183),
  `nessuna` (D184). Two spelling splits settled on the page image
  (`periculosa`, `voluntà`). Two verbless periods emended `[È]` (D181).
  Five stops supplied from the 1933 edition (D67); seven marks both readers
  see and neither can weigh follow the 1933 edition (D110).
witness_independence_check: "SCOPE §7. The passes split at two loci, both spelling: at .03 `voluntà` pass A reads `volontà`, which is neither Canestrini's nor the 1933 edition's (`voluntá`); at .02 `periculosa` pass B reads `pericolosa`, which is the 1933 form. No pattern; both are u/o misreadings on a scan that breaks u. Neither pass carries a Palmarocchi word-reading."
boundaries: "printed pp. 23-26; four indented paragraphs (p. 23 `Il titulo`, p. 25 `L'altro caso`, p. 25 `E altro il caso`, p. 26 `Però questi pensieri`); ends p. 26 `che abbia fatto.`; CONSIDERAZIONE SUL CAPITOLO XI follows on the same page"
