collation_result: >
  426 words (A and B). Two word-level splits: `dentro`/`dentra`, read
  `dentro` (D291); `nobilità`/`nobiltà`, read `nobilità` (D292). One doubt
  common to both readers, read as both prefer: `tennono` (D294). Two
  readings kept against the 1933 edition: `discordia` (D290) and `delle
  nuove leggi` (D293). One split of pointing and four common doubts of
  pointing settled by D110. No clause or sense disagreement.
witness_independence_check: "SCOPE §7. At `nobilità` pass A agrees with the 1933 edition and pass B does not; at `dentro` the 1933 form is the only word available. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `discordia`, `il governo`, `il populo`, `concioni`, `le paci`, `deliberazioni importanti`, `delle nuove leggi`, `le cose gravi`, `le arti populari`, `e in conseguenza`, `D'onde`, against the 1933 `differenzia`, `el governo`, `el popolo`, `concione`, `le pace`, `deliberazione importante`, `della nuova legge`, `le cose grave`, `le arte populare`, `ed in consequenzia`, `Donde`. The passes read Canestrini."
boundaries: "printed pp. 42-43; heading CONSIDERAZIONE SUL CAPITOLO XXVIII on p. 42 after line 3, the last line of the reply on XXVI (`e remedii estraordinarii e violenti.`); Canestrini's two-line rubric `Per qual cagione i Romani furono meno ingrati agli loro cittadini che gli Ateniesi.`; one indented paragraph (`Se Roma`); ends p. 43 `di battere e potenti.`; CONSIDERAZIONE SUL CAPITOLO XXIX follows on the same page. No notes of Canestrini's."
