collation_result: >
  170 words (A 170, B 170), the body tokens identical after preferred
  readings. The rubric's `qualunqua`/`qualunque` read `qualunque` with the
  1933 edition (D406); the lacuna after `Cicerone nel` printed `. . .`
  (D407); `e così con verità` kept against the 1933 `così è` (D408). The
  common doubt at `consule ___ e se` read `;` and the faint stop at `tempo.`
  read with the 1933 edition (D110); no stop at the unit's end (D40).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `il Discorso`, `il divieto` (twice), `il tempo`, `così con verità`, `principii`, `il consulato;`, `e almanco`, `leggi`, `utili`, rubric `senza`, against the 1933 `el Discorso`, `el divieto`, `el tempo`, `così è con verità`, `princípi`, `el consulato,`, `ed almanco`, `legge`, `utile`, `sanza`. The passes read Canestrini."
boundaries: "printed pp. 59-60; heading CONSIDERAZIONE SUL CAPITOLO LX on p. 59 below the end of the LVIII reply (`in uno principe`); Canestrini's two-line rubric, no stop; one indented paragraph; ends p. 60 l. 6 `non essendo trattate nel Discorso`, no stop visible; CONSIDERAZIONE SUL PROEMIO DEL LIBRO II follows on p. 60 (no reply on LIX)"
