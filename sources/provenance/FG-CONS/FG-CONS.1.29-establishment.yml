collation_result: >
  1,264 words (A and B). Two word-level splits, each between forms of one
  word: `periculo`/`pericolo`, read `periculo`, and `abbino`/`abbine`, read
  `abbino` (D306). Nine doubts common to both readers whose alternatives are
  words, read with the 1933 edition (D307). Two confident shared readings
  against the 1933 edition at letters the scan breaks, kept (D308); one, a
  non-word, emended `ség[u]ito` (D309). One sense-bearing difference kept
  (D310). Seven marks settled by D110 and D67. No clause or sense
  disagreement.
witness_independence_check: "SCOPE §7. At `pericolo` pass B agrees with the 1933 edition against the shape both readers report; at `abbino` pass A does. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `origini sue`, `il populo`, `ignoranza`, `occasioni`, `remunerazioni`, `de' populi`, `dentro`, `esecuzioni forti`, `duo capi`, `cagioni`, `reputazione`, `discordie`, `da lui`, `errò in questo Roma`, `dice`, `contro Asiatico`, against the 1933 `origine sua`, `el popolo`, `ignoranzia`, `occasione`, `remunerazione`, `de' popoli`, `drento`, `esecuzione forte`, `duoi capi`, `cagione`, `riputazione`, `differenzie`, `tra lui`, `[Roma] errò in questo`, `dica`, `contro a Asiatico`. The passes read Canestrini."
boundaries: "printed pp. 43-47; heading CONSIDERAZIONE SUL CAPITOLO XXIX on p. 43 after line 22, the last line of the reply on XXVIII (`lità di battere e potenti.`); Canestrini's one-line rubric `Quale sia più ingrato, o un popolo, o un principe`; six indented paragraphs (`Se bene`, `Quanto al sospetto`, `Quanto agli altri duo capi`, `Restano`, `Quanto agli esempli`, `Nè voglio`); two notes of Canestrini's (p. 46, p. 47); ends p. 47 line 30 `o l' altro.`; CONSIDERAZIONE SUL CAPITOLO XXX opens p. 48"
