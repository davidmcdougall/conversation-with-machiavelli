witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `furno`, `necessarii`, `ridicula, ma`, `le armi`, `le munizioni`, `nella guerra, e quali`, `e in ogni caso e in ogni`, `dietro`, `da poi`, `proprii`, `mercenarii`, `e anche`, `proprii, e ognuno`, `interpreterà`, `sentenza`, `comunemente`, against the 1933 `siano`, `necessari`, `ridicula; ma`, `le arme`, `le munizione`, `nella guerra; e' quali`, `ed in ogni caso ed in`, `drieto`, `dappoi`, `propri`, `mercennari`, `ed anche`, `propri; ed ognuno`, `interpreterrá`, `sentenzia`, `communemente`. At the one split, pass A preferred the 1933 letter and gave the printed one as its alternative: a preference for sense, not a reading of the other book. The passes read Canestrini."
boundaries: "printed pp. 61-62; heading CONSIDERAZIONE SUL CAPITOLO X DEL LIBRO II. on p. 61 below the end of the proem's reply (`più vir- / tuosa che l' altre`), then a two-line rubric in smaller type; one indented paragraph; ends p. 62 `in modo alcuno`, no stop visible to either; CONSIDERAZIONE SUL CAPITOLO XII follows with its rubric"
heading: "CONSIDERAZIONE SUL CAPITOLO X DEL LIBRO II., as build.py prints it for Book II (D421)"
rubric: "I danari non sono il nervo della guerra, secondo che ⟨è|e⟩ la comune / oppinione⟨.|∅⟩, both readers doubting the accent and the stop: `è`, the verb, as the 1824 rubric and the 1933 edition's bracketed rubric; no stop, as Canestrini's other rubrics are carried (D430)"
