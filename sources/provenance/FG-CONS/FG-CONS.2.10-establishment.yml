normalisation_notes: "Class A: accents (`nè` → `né`, `perchè` → `perché`); the apostrophe of the apocopated article and pronoun supplied (`e danari` → `e' danari`, `e soldati`, `e fussino`, `e quali`); Canestrini's thin space after the apostrophe closed up (`l' ha` → `l'ha`) or kept as a word space after the apocopated form (`a' tempi`, `co' soldati`); line-end hyphens removed; Canestrini's note call removed with his note."
