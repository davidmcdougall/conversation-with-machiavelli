collation_result: >
  973 words (A 973, B 973), the body tokens identical after preferred readings
  but for `esemplo`/`esamplo`, `e`/`o nel quale` and the rubric's
  `savia`/`savio`. The rubric read with the 1933 edition (D395); `esamplo` and
  `o nel quale`, the printed letter seen by both readers, emended (D396,
  D397); the common doubt `sì noti` read with the 1933 edition (D398);
  `sotto a principi` kept under D203(b) (D399); four sense-bearing words kept
  against the 1933 (D400). Three ,/; splits and one doubtful comma read with
  the 1933 edition (D110); no stop at the unit's end (D40).
witness_independence_check: "SCOPE §7. Neither pass carries a Palmarocchi word-reading where Canestrini differs: both have `populo` throughout, `constanza`, `prudenza`, `il governo`, `leggi`, `negozii`, `dissonanza`, `deliberazioni`, `le quali`, `ignoranza`, `comune`, `esempli`, `regolata di buone leggi`, `accuratissimi`, `procederia`, `si troveria` ×4, `titulo`, `verbi gratia`, `vizii`, `cagioni`, `sotto a principi`, rubric `un principe`, against the 1933 `popolo`, `constanzia`, `prudenzia`, `el governo`, `legge`, `negocii`, `dissonanzia`, `deliberazione`, `le quale`, `ignoranzia`, `commune`, `regolata da buone legge`, `amantissimi`, `procedeva`, `si troverrá`, `el titolo`, `verbigrazia`, `vizi`, `cagione`, `sotto e' principi`, `uno principe`. At the three splits pass A preferred the 1933 word but recorded the printed glyph as its alternative each time; a preference for sense, not a reading of the other book. The passes read Canestrini."
boundaries: "printed pp. 54-59; heading CONSIDERAZIONE SUL CAPITOLO LVIII on p. 54 below the end of the XLIX reply (`benchè lo credo`); Canestrini's one-line rubric, no stop; three indented paragraphs (`Difficile impresa` p. 54; `Gli esempli` p. 56; `Di poi` p. 57); ends p. 59 `in uno populo che in uno principe`, no stop visible; CONSIDERAZIONE SUL CAPITOLO LX follows on p. 59 (no reply on LIX)"
