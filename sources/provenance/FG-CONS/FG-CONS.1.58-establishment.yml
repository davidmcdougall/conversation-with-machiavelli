normalisation_notes: "Class A: accents (`perchè` → `perché`, `nè`/`Nè` → `né`/`Né`, `sè` → `sé`); the apostrophe of the plural article supplied (`e quali` ×2, `e venti`, `e governi`, `e termini`, `per e quali`, `e successori` → `e'`), and of the apocopated article (`da principali` → `da' principali`, `de re` → `de' re`, `ne principi` → `ne' principi`); spaces before punctuation removed; line-end hyphens removed; footnote calls removed with Canestrini's notes."
